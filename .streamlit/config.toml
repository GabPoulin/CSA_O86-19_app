# Couleurs de Le Repère (voir marque/couleurs.md) :
# Vert forêt   = #233614 (principale)
# Orange brûlé = #9E5A00 (accent)
# Charbon      = #333333 (texte)
# Gris         = #8F8F8F (bordures)
# Gris pâle    = #EEEEEE (fond secondaire)
# Sable        = #F4F1EA (fond)
[theme]
primaryColor = "#9E5A00"
backgroundColor = "#F4F1EA"
secondaryBackgroundColor = "#EEEEEE"
textColor = "#333333"
linkColor = "#9E5A00"
redColor = "#E66437"
orangeColor = "#9E5A00"
yellowColor = "#E6B035"
blueColor = "#3778C2"
greenColor = "#233614"
violetColor = "#7F5AF0"
grayColor = "#8F8F8F"
# fonts
font = "sans-serif"
baseFontSize = 15
baseFontWeight = 500
baseRadius = "medium"
buttonRadius = "large"
linkUnderline = false
showWidgetBorder = true

[theme.sidebar]
primaryColor = "#F4F1EA"
backgroundColor = "#233614"
secondaryBackgroundColor = "#EEEEEE"
textColor = "#F4F1EA"
